services:
  postgres:
    image: postgres:16-alpine
    container_name: chessscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chessscope
      POSTGRES_PASSWORD: chessscope
      POSTGRES_DB: chessscope
    ports:
      - "5432:5432"
    volumes:
      - chessscope-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chessscope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  chessscope-postgres-data:

# Render Blueprint — deploys all four ChessScope services + the database in
# one shot. In Render's dashboard: New -> Blueprint -> pick this repo.
#
# Service names below become each service's default onrender.com subdomain
# (e.g. chessscope-api -> https://chessscope-api.onrender.com), IF that name
# isn't already taken by someone else on Render. If Render has to suffix it
# (e.g. chessscope-api-a1b2), the two `https://chessscope-api.onrender.com`
# references below (chessscope-worker doesn't need one; only the frontend's
# VITE_API_BASE_URL and the api service's own BACKEND_BASE_URL do) will be
# wrong — fix by editing that one env var in Render's dashboard and
# redeploying, no code change needed. There's no Blueprint-level way to
# auto-inject a service's *public* URL (only its private-network host, which
# the browser can't reach), so this one manual check after first deploy is
# unavoidable.

databases:
  - name: chessscope-db
    plan: free

services:
  # --- API -------------------------------------------------------------
  - name: chessscope-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # `preDeployCommand` isn't available on the free plan, so migrations run
    # as part of this service's own start command instead — only here, never
    # on chessscope-worker below, so two containers never race running
    # `alembic upgrade head` against each other on a simultaneous first boot.
    # No explicit `dockerCommand` — the Dockerfile's own default CMD runs
    # scripts/start-api.sh, which does exactly this.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chessscope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chessscope-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        value: https://chessscope-frontend.onrender.com
      - key: BACKEND_BASE_URL
        value: https://chessscope-api.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://chessscope-frontend.onrender.com
      # Bot gameplay (routers/bot_games.py -> tal_bot.choose_bot_move) runs
      # Stockfish synchronously inside *this* service, not the worker — a
      # real gap in the original tuning pass, which only ever set these on
      # chessscope-worker. Left at STOCKFISH_HASH_MB's 512MB code default,
      # a single Grandmaster-tier bot move tries to allocate a 512MB hash
      # table alone, on a container whose *entire* memory limit is 512MB —
      # a near-guaranteed crash, confirmed against a real "exceeded its
      # memory limit" restart right after starting a bot game.
      - key: STOCKFISH_THREADS
        value: "1"
      - key: STOCKFISH_HASH_MB
        value: "64"

  # --- Celery worker, disguised as a free web service -------------------
  # Background Workers can't use Render's free plan; a Web Service can. This
  # runs the real `celery worker` as a background process and a two-route
  # stub ASGI app (app/worker_health.py) in the foreground just to satisfy
  # the "must bind $PORT" requirement of the free web-service plan. Nothing
  # ever calls this service's HTTP routes for real work.
  - name: chessscope-worker
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # A bare script path, not an inline shell string — Render's dockerCommand
    # does not run through a real shell (confirmed against a real deploy: it
    # was handed the whole string, `&&`/`&` included, as one literal command
    # name and failed with "not found"). scripts/start-worker.sh does the
    # actual backgrounding/chaining itself, safely, regardless.
    dockerCommand: ./scripts/start-worker.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chessscope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chessscope-redis
          type: keyvalue
          property: connectionString
      # Conservative for a free instance's limited CPU/RAM — trades analysis
      # depth/speed for actually fitting. Safe to raise later from Render's
      # dashboard (no redeploy needed) if/when this moves to a paid plan.
      - key: STOCKFISH_DEPTH
        value: "14"
      - key: STOCKFISH_THREADS
        value: "1"
      - key: STOCKFISH_HASH_MB
        value: "64"
      - key: ANALYSIS_POOL_SIZE
        value: "1"
      - key: ANALYSIS_POOL_THREADS_PER_ENGINE
        value: "1"
      # More threads/pool size wouldn't help here — this instance only ever
      # has ~0.1 real CPU, so extra concurrency just competes for the same
      # fractional budget with added overhead rather than doing more work in
      # parallel.
      #
      # This value was 30s, aimed at reliably reaching depth 14. It reached
      # it, but at a real wall-clock cost that made a whole game's analysis
      # look hung: the same CPU-starvation overshoot measured for the bot's
      # per-move budget (tal_bot.py — a *requested* Stockfish search time
      # inflates 2-3.5x in real time on this host) applies here too, and
      # with ANALYSIS_POOL_SIZE=1 every position is fully sequential, so a
      # ~40-move game at "30s/position" was actually more like 40-70 minutes
      # of real waiting with zero visible feedback beyond a progress bar.
      # Cut to 5s so a game finishes in single-digit minutes instead —
      # trading search depth (position analysis will usually land well
      # short of the depth-14 ceiling above) for a job that visibly
      # completes. Safe to raise back once this is off the free tier.
      - key: ANALYSIS_TIME_LIMIT_S
        value: "5"

  # --- Redis-compatible broker / progress pub-sub -----------------------
  - name: chessscope-redis
    type: keyvalue
    plan: free
    # Both consumers (the api and worker services above) reach this over
    # Render's private network via `fromService`, never the public internet,
    # so blocking all external connections is the correct — and more
    # secure — choice here, not just a way to satisfy the required field.
    ipAllowList: []

  # --- Frontend static build ---------------------------------------------
  - name: chessscope-frontend
    type: web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Vite bakes this in at *build* time, not read at runtime — this must
      # be correct before `npm run build` runs, which is exactly when Render
      # applies it during the build step above.
      - key: VITE_API_BASE_URL
        value: https://chessscope-api.onrender.com
    routes:
      # React Router's client-side routes (e.g. /login, /analysis/:id) only
      # exist in JS — without this, anything but the literal `/` 404s on a
      # direct visit or a reload.
      - type: rewrite
        source: /*
        destination: /index.html
